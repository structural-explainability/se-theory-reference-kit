# ============================================================
# pyproject.toml (Python project configuration)
# ============================================================
# Updated: 2026-10-03
# REQ: Python projects MUST include pyproject.toml as the single source of truth.
# WHY: Centralizes project configuration.
# CUSTOM: Update identity and build tool src folders.

# ============================================================
# SECTION 1: PROJECT IDENTITY (name, version, CUSTOM dependencies)
# ============================================================

[project]
name = "se-theory-reference-kit" # Package distribution name (lowercase and dashes).
description = "Shared tooling for validating, scaffolding, and exporting Structural Explainability theory-reference artifacts."
readme = "README.md"
requires-python = ">=3.15"
dynamic = ["version"] # WHY: Version is computed from git tags at build time (see [tool.hatch.version] below).
license = { file = "LICENSE" }
authors = [
    { name = "Structural Explainability", email = "se@structural-explainability.org" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
keywords = [
    "structural-explainability",
    "se-theory-reference-kit",
    "lean4",
    "lean",
    "theory-reference",
    "reference-artifacts",
    "repository-verification",
    "manifest-validation",
    "artifact-validation",
    "export-validation",
    "diagnostics",
    "traceability",
    "conformance",
]
dependencies = []

[dependency-groups]
# WHY: Dependency groups separate development and documentation tools from project runtime dependencies.

dev = [
    # REQ.DEV.DEPS: External packages used for linting, testing, type checking, etc.
    "prek",       # WHY: Pre-commit hooks for consistent formatting and linting (replaces pre-commit).
    "pytest>=9",  # WHY: Test framework for unit and integration tests.
    "pytest-cov", # WHY: Test coverage reporting for quality metrics and CI gating.
    "ruff",       # WHY: Fast linting and formatting for Python code.
    "ty",         # WHY: Type checking for static analysis and type safety.
]

docs = [
    # REQ.DOCS.DEPS: External packages used to generate project documentation.
    "zensical",
    "mkdocstrings[python]", # WHY: Auto-generate API docs from docstrings.
]

[project.scripts]
se-theory-reference-kit = "se_theory_reference_kit.cli:main"

[project.urls]
Homepage = "https://github.com/structural-explainability/se-theory-reference-kit"
Repository = "https://github.com/structural-explainability/se-theory-reference-kit"
Documentation = "https://structural-explainability.github.io/se-theory-reference-kit/"
Issues = "https://github.com/structural-explainability/se-theory-reference-kit/issues"
Changelog = "https://github.com/structural-explainability/se-theory-reference-kit/blob/main/CHANGELOG.md"

# ============================================================
# SECTION 2: TOOL CONFIGURATION (Professional basics)
# ============================================================

# === PYTEST (VERIFY LOGIC) ===

[tool.pytest.ini_options]
# WHY: Consistent test discovery and coverage visibility.
minversion = "9.0"
testpaths = ["tests"]
addopts = "--cov=src/se_theory_reference_kit/ --cov-fail-under=50 --cov-report=term-missing"

# === RUFF (PYTHON FORMATTING AND LINTING) ===
[tool.ruff]

[tool.ruff.lint] # WHY: Evolve with Ruff's defaults; production might pin an explicit set.
extend-select = [
    # --- turn on for additional linting rules ---
    "D", # WHY: Require docstrings; VS Code helps generate them.
]

[tool.ruff.lint.isort] # WHY: Sort plain-import and from-import lines together within each section.
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores] # WHY: Some file types need lint exceptions.
"src/**/__init__.py" = ["F401"] # Allow re-export patterns.
"src/**/_version.py" = ["ALL"] # Auto-generated file; do not lint.
"tests/**/*.py" = ["D", "B018"] # Tests need no docstrings; B018 is default-on.
"notebooks/**/*.py" = [
    "D",
    "PLR1711",
    "RUF059",
] # marimo cells: bare returns + cell-scoped unused vars are the format, not defects

[tool.ruff.lint.pydocstyle] # WHY: Use Google docstring style when D is enabled.
convention = "google"

# === UV (PYTHON ENVIRONMENT AND DEPENDENCY MANAGEMENT) ===

[tool.uv]
# WHY: Install all dependency groups defined by this repository by default.
# OBS: This keeps the canonical `uv sync` command identical across project types
#      and ensures all repository features work after setup.
default-groups = "all"
# WHY: Give a bit of time to find hijacked releases before installing.
# CUSTOM: Should match `uv run prek update --freeze --cooldown-days 7`
exclude-newer = "7 days"

# ============================================================
# SECTION 3: BUILD SYSTEM
# ============================================================
#
# REQ: A build system MUST be declared for package discovery.
# REQ: All importable code MUST live under src/.
# WHY src/ layout: Prevents accidental imports from the repo root;
# ensures consistent behavior across IDEs, tests, CI, and PyPI.

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.build.hooks.vcs]
# WHY: Writes computed version into src/*/_version.py at build time.
# CUSTOM: Must match src/ folders.
version-file = "src/se_theory_reference_kit/_version.py"

[tool.hatch.build.targets.wheel]
# CUSTOM: Must match src/ folders.
packages = ["src/se_theory_reference_kit"]

[tool.hatch.version]
# WHY: Version is derived from git tags.
source = "vcs"
tag-pattern = "^(?:v)?(?P<version>\\d+\\.\\d+\\.\\d+)$"

[tool.hatch.version.raw-options]
# WHY: Allow hatch-vcs to find the Git root when built from a subdirectory,
# temporary build directory, or isolated build environment.
search_parent_directories = true
